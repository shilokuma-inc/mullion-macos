# ビルド（＋テスト）の共通処理。build.yml から workflow_call で呼び出される。
name: _build

on:
  workflow_call:
    inputs:
      xcode-version:
        description: maxim-lobanov/setup-xcode に渡す Xcode バージョン
        type: string
        # README の Environment と揃える。ランナー側の更新でビルドが変わらないよう固定する
        default: '26.3'
      ui-tests:
        description: UI テスト（<プロジェクト名>UITests）も実行するか。false なら Unit テストだけ実行する
        type: boolean
        default: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode-version }}

      - name: Checkout
        uses: actions/checkout@v7

      - name: Allow SwiftLint build tool plugin
        run: defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES

      - name: Set up environment
        # プロジェクト名と同名の共有スキームが存在することを前提にする
        run: |
          project=$(basename -s .xcodeproj ./*.xcodeproj)
          echo "PROJECT_NAME=$project" >> "$GITHUB_ENV"
          echo "SCHEME=$project" >> "$GITHUB_ENV"
          echo "project=$project scheme=$project"

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT_NAME.xcodeproj" \
            -scheme "$SCHEME" \
            -derivedDataPath DerivedData

      - name: SwiftLint
        # Build Tool Plugin と同じバージョンの SwiftLint（SPM が解決したバイナリ）で .swiftlint.yml を検証する
        run: |
          swiftlint=$(find DerivedData/SourcePackages/artifacts -type f -name swiftlint -path '*macos*' | head -1)
          if [[ -z "$swiftlint" ]]; then
            echo "::error::SPM が解決した SwiftLint バイナリが見つかりません" >&2
            exit 1
          fi
          "$swiftlint" version
          "$swiftlint" lint --strict --reporter github-actions-logging

      - name: Build and test
        # UI テストは共有ランナー上で起動待ちに失敗することがあるため、失敗したテストだけ 1 回再試行する
        # （-test-iterations は初回を含む実行回数の上限）
        env:
          UI_TESTS: ${{ inputs.ui-tests }}
        run: |
          options=()
          if [[ "$UI_TESTS" != "true" ]]; then
            # UI テストはアプリの起動と操作を含めて時間がかかるため、作業ブランチでは省く
            options+=(-skip-testing:"${SCHEME}UITests")
          fi
          # ランナーには署名用の証明書が無いためアドホック署名にする。
          # App Sandbox を有効にしたままアドホック署名すると test runner がアプリに接続できずに止まるため、テスト時だけ無効にする
          # 並列テストはテストランナーを複製して起動するため、テストが少ないうちは使わない
          xcodebuild test \
            -project "$PROJECT_NAME.xcodeproj" \
            -scheme "$SCHEME" \
            -destination "platform=macOS" \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -parallel-testing-enabled NO \
            ${options[@]+"${options[@]}"} \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            ENABLE_APP_SANDBOX=NO

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: TestResults.xcresult
          path: TestResults.xcresult
